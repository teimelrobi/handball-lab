name: KéziStat Desktop Windows test installer
on:
  push:
    branches:
      - feature/desktop-offline-foundation
    paths:
      - 'desktop/**'
      - 'package.json'
      - 'index.html'
      - 'icons/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Windows icon
        run: |
          python -m pip install --disable-pip-version-check pillow
          python desktop/build-icon.py
      - name: Build portable Windows ZIP
        id: portable
        continue-on-error: true
        shell: pwsh
        run: |
          npm run desktop:zip 2>&1 | Tee-Object -FilePath portable-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder
      - name: Build Windows installer
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          npm run desktop:installer 2>&1 | Tee-Object -FilePath installer-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder
      - name: Upload Windows build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KeziStat-Desktop-Windows-Test
          path: |
            dist/*.exe
            dist/*.zip
            portable-build.log
            installer-build.log
          if-no-files-found: error
          retention-days: 14
      - name: Report build result
        if: always()
        shell: pwsh
        run: |
          Write-Host "Portable ZIP: ${{ steps.portable.outcome }}"
          Write-Host "Installer: ${{ steps.installer.outcome }}"
          if ('${{ steps.portable.outcome }}' -ne 'success' -and '${{ steps.installer.outcome }}' -ne 'success') { exit 1 }
