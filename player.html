<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Handball Lab · Videólejátszó</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b161b;color:#f5f9fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{padding:16px 20px;background:#102329;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:18px}header span{color:#48c9a9}.container{max-width:1100px;margin:30px auto;padding:0 14px}.player{background:#000;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:16/9}iframe{width:100%;height:100%;border:0}p{color:#b4c4c9;line-height:1.5}a{color:#4fe0b7}#error{display:none;padding:25px;background:#172b31;border-radius:10px}@media(max-width:600px){.container{margin:12px auto}.player{aspect-ratio:9/12}header strong{font-size:16px}}</style></head>
<body><header><strong>HANDBALL <span>LAB</span></strong><small>Jelenet lejátszása</small></header><main class="container"><div id="player" class="player"></div><div id="error">Érvénytelen vagy hiányzó videóazonosító.</div><p>Az adott jelenetet közvetlenül itt nézheted meg. A lejátszás a Google Drive videófeldolgozásától is függ. Ha még nem indul, később próbáld újra.</p></main><script>
const id=new URLSearchParams(location.search).get('v');
if(id&&/^[A-Za-z0-9_-]{10,}$/.test(id)){const f=document.createElement('iframe');f.src='https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview';f.allow='autoplay; fullscreen; picture-in-picture';f.allowFullscreen=true;f.title='Handball Lab jelenet';f.referrerPolicy='strict-origin-when-cross-origin';document.getElementById('player').appendChild(f);}else{document.getElementById('player').style.display='none';document.getElementById('error').style.display='block';}
</script></body></html>
